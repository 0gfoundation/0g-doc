name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint code
      run: |
        if [ -f "package.json" ] && grep -q '"lint"' package.json; then
          pnpm lint
        else
          echo "No lint script found, skipping..."
        fi

    - name: Type check
      run: |
        if [ -f "tsconfig.json" ]; then
          npx tsc --noEmit
        else
          echo "No TypeScript config found, skipping type check..."
        fi

    - name: Build documentation
      run: pnpm build
    
    - name: Test build output
      run: |
        if [ ! -d "build" ]; then
          echo "Build directory not found!"
          exit 1
        fi
        if [ ! -f "build/index.html" ]; then
          echo "Index.html not found in build directory!"
          exit 1
        fi
        echo "Build successful ✅"

  link-checker:
    name: Check Links
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build site
      run: pnpm build
    
    - name: Serve site and check links
      run: |
        npm install -g broken-link-checker serve

        # Mirror Vercel routing locally: cleanUrls + redirects from vercel.json
        # (serve rejects the $schema field, so strip it)
        jq 'del(.["$schema"])' vercel.json > /tmp/serve.json

        serve build -p 3000 -c /tmp/serve.json > /tmp/serve.log 2>&1 &
        SERVER_PID=$!

        # Wait for serve to accept connections
        for i in $(seq 1 30); do
          curl -sf -o /dev/null http://localhost:3000/ && break
          sleep 1
        done

        BLC_OUT=$(blc http://localhost:3000 --recursive --exclude-external 2>&1 || true)
        BROKEN=$(echo "$BLC_OUT" | grep -c "BROKEN" || true)
        UNIQUE=$(echo "$BLC_OUT" | grep "BROKEN" | sort -u || true)

        {
          echo "## 🔗 Link Checker Results"
          echo ""
          echo "**Broken internal links: $BROKEN**"
          if [ "$BROKEN" -gt 0 ]; then
            echo ""
            echo "<details><summary>Show broken links</summary>"
            echo ""
            echo '```'
            echo "$UNIQUE"
            echo '```'
            echo ""
            echo "</details>"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        kill $SERVER_PID 2>/dev/null || true

        if [ "$BROKEN" -gt 0 ]; then
          echo "::error::$BROKEN broken internal links found"
          exit 1
        fi


  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Spell check
      uses: streetsidesoftware/cspell-action@v6
      with:
        files: |
          **/*.md
          **/*.mdx
          docs/**/*.md
        config: .cspell.json
        incremental_files_only: false

