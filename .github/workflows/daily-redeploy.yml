name: Daily production redeploy

# The homepage network stats are fetched at build time (src/plugins/live-stats-plugin.js).
# Rebuilding production once a day keeps them at most about a day old without any
# runtime fetch. Uses the repository's existing VERCEL_TOKEN, VERCEL_ORG_ID and
# VERCEL_PROJECT_ID secrets to create a production deployment of main through the
# Vercel API. If a VERCEL_DEPLOY_HOOK_URL secret is set it is used instead.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger a production deployment of main
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          REPO_ID: '849628438'
        run: |
          set -euo pipefail
          if [ -n "$HOOK" ]; then
            code=$(curl -s -o response.json -w '%{http_code}' -X POST "$HOOK")
            echo "deploy hook responded $code"; cat response.json || true
            case "$code" in 200|201) exit 0;; *) echo "::error::deploy hook failed with HTTP $code"; exit 1;; esac
          fi
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::no VERCEL_DEPLOY_HOOK_URL and no VERCEL_TOKEN/VERCEL_PROJECT_ID; skipping. See AGENTS.md (Deployments)."
            exit 0
          fi
          team=""; [ -n "$VERCEL_ORG_ID" ] && team="?teamId=$VERCEL_ORG_ID"
          body=$(jq -n --arg p "$VERCEL_PROJECT_ID" --argjson r "$REPO_ID" \
            '{name: "0g-doc", project: $p, target: "production", gitSource: {type: "github", repoId: $r, ref: "main"}}')
          code=$(curl -s -o response.json -w '%{http_code}' -X POST "https://api.vercel.com/v13/deployments$team" \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" --data "$body")
          echo "Vercel API responded $code"
          jq -r '"deployment: \(.id // "-") project: \(.name // "-") target: \(.target // "-") url: \(.url // "-") error: \(.error.message // "-")"' response.json || cat response.json
          case "$code" in 200|201|202) ;; *) echo "::error::Vercel deployment request failed with HTTP $code"; exit 1;; esac
