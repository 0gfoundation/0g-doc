# core-js / core-js-pure only run a postinstall donation banner — no real
# build step — so pnpm 10+ is told not to run their scripts. Without this,
# pnpm aborts installs (and therefore `pnpm start`/`build`) with
# ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  core-js: false
  core-js-pure: false
  # @0gfoundation/ask-ai-widget installs from GitHub (no npm release), so its
  # `prepare` script must run on install to build dist/. Without this, pnpm
  # aborts with ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED.
  "@0gfoundation/ask-ai-widget": true

# @lottielab/lottie-player pulls lottie-web via a git URL (an "exotic"
# resolution). pnpm 11 blocks git-resolved subdependencies by default;
# this dependency predates the upgrade and worked under pnpm 9, so allow it.
blockExoticSubdeps: false
